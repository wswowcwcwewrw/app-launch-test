<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アプリ起動テスト（改善前 / 改善後）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      margin-bottom: 10px;
    }
    button {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: none;
      color: #fff;
    }
    .btn-old { background: #ff3b30; }
    .btn-new { background: #34c759; }

    a {
      display: block;
      text-align: center;
      color: #007aff;
      text-decoration: none;
      font-size: 16px;
      margin-top: 20px;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .log {
      margin-top: 20px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-title {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h2>ALF-Web 発注アプリ 起動テスト</h2>

  <!-- 改善前 -->
  <button class="btn-old" onclick="openAppOld()">
    アプリを開く（改善前：遅延そのまま）
  </button>

  <!-- 改善後 -->
  <button class="btn-new" onclick="openAppNew()">
    アプリを開く（改善後：イベント可視化）
  </button>

  <a href="https://itunes.apple.com/us/app/alf-web-fa-zhu/id1183627756?l=ja&ls=1&mt=8">
    App Store を開く
  </a>

  <div class="note">
    <p><strong>改善前：</strong> 起動後も遅延処理が必ず走る</p>
    <p><strong>改善後：</strong> アプリ切替を検知したらフォールバックを抑止</p>
  </div>

  <!-- ログ表示 -->
  <div id="log" class="log">
    <div class="log-title">ログ</div>
  </div>

  <script>
    var APP_URL = 'orderapp://';
    var IOS_STORE = 'https://itunes.apple.com/us/app/alf-web-fa-zhu/id1183627756?l=ja&ls=1&mt=8';
    var ANDROID_PACKAGE = 'jp.alfweb.orderApp';

    function log(msg) {
      var logEl = document.getElementById('log');
      var time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =====================================================
    // 改善前（元コードそのまま）
    // =====================================================
    function openAppOld() {
      log('--- 改善前 openAppOld() ---');
      var ua = navigator.userAgent.toLowerCase();

      if (ua.match(/iphone|ipad|ipod/)) {
        log('iOS detected');
        log('location.href = orderapp://');
        location.href = APP_URL;

        setTimeout(function() {
          log('fallback timer fired → go App Store');
          location.href = IOS_STORE;
        }, 500);

      } else if (ua.match(/android/)) {
        log('Android detected');
        location.href =
          'intent://#Intent;' +
          'scheme=orderapp;' +
          'package=' + ANDROID_PACKAGE + ';end';
      }
    }

    // =====================================================
    // 改善後（イベント可視化）
    // =====================================================
    function openAppNew() {
      log('--- 改善後 openAppNew() ---');
      var ua = navigator.userAgent.toLowerCase();

      if (ua.match(/iphone|ipad|ipod/)) {
        log('iOS detected');
        var opened = false;

        log('try open scheme: orderapp://');
        location.href = APP_URL;

        document.addEventListener('visibilitychange', function onChange() {
          log('visibilitychange fired');
          log('document.hidden = ' + document.hidden);

          if (document.hidden) {
            opened = true;
            log('app switch detected → opened = true');
            document.removeEventListener('visibilitychange', onChange);
          }
        });

        setTimeout(function() {
          log('fallback timer fired');
          if (!opened) {
            log('opened = false → go App Store');
            location.href = IOS_STORE;
          } else {
            log('opened = true → skip App Store');
          }
        }, 2500);

        return;
      }

      if (ua.match(/android/)) {
        log('Android detected');
location.href =
  'intent://open#Intent;' +
  'scheme=orderapp;' +
  'package=jp.alfweb.orderApp;' +
  'S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Djp.alfweb.orderApp;' +
  'end';


      }
    }
  </script>

</body>
</html>
